stages:
  - prepare-image
  - build
  # There are no tests yet, but maybe soon
  #- test

development-image:
  stage: prepare-image
  image: docker:19.03.12
  variables:
    # Otherwise the docker magic does not work: https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  services:
    - docker:19.03.12-dind
  script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN 
    - cd scripts
    - docker build -t $CI_REGISTRY/aqua/tools/gdart/spout/development:26.04 -f graal-image.Dockerfile .
    - docker push $CI_REGISTRY/aqua/tools/gdart/spout/development:26.04
  rules:
    - changes:
      - scripts/graal-image.Dockerfile
  tags:
    - privileged

build:
  stage: build
  image: $CI_REGISTRY/aqua/tools/gdart/spout/development:26.04
  script:
    - source /data/envs/mx_env/bin/activate
    - cd espresso
    - mx --java-home /data/labsjdk-gdart-25+37-jvmci-b01/ --env native-ce build
